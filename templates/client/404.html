<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Страница не найдена - QR Menu</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-slate-950 text-white">
    <main class="flex min-h-screen items-center justify-center px-5 py-10">
        <section class="w-full max-w-4xl overflow-hidden rounded-2xl border border-white/10 bg-white/5 shadow-2xl">
            <div class="grid items-center gap-8 p-6 sm:p-10 lg:grid-cols-[1fr_0.85fr]">
                <div>
                    <div class="inline-flex rounded-full bg-blue-500/15 px-3 py-1 text-sm font-semibold text-blue-200">
                        Ошибка 404
                    </div>
                    <h1 class="mt-5 text-4xl font-bold tracking-tight sm:text-6xl">
                        Страница не найдена
                    </h1>
                    <p class="mt-4 max-w-xl text-base leading-7 text-slate-300">
                        Такой страницы или ресторана нет. Проверьте ссылку или вернитесь на главную страницу QR Menu.
                    </p>
                    <div class="mt-7 flex flex-wrap gap-3">
                        <a href="/" class="rounded-md bg-blue-600 px-5 py-3 text-sm font-semibold text-white hover:bg-blue-700">
                            На главную
                        </a>
                        <a href="/admin" class="rounded-md border border-white/15 px-5 py-3 text-sm font-semibold text-slate-100 hover:bg-white/10">
                            Админка
                        </a>
                    </div>
                </div>
                <div class="rounded-xl border border-white/10 bg-slate-900 p-5">
                    <div class="rounded-lg border border-dashed border-slate-600 p-6 text-center">
                        <div class="text-7xl font-black text-blue-300">404</div>
                        <div class="mt-3 text-sm font-medium text-slate-300">QR-код или ссылка ведет в пустоту</div>
                    </div>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
