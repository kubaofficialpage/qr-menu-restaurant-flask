<div class="grid gap-4 sm:grid-cols-2">
    <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700">Название блюда</label>
        <input name="name" value="{{ menu_item.name if menu_item is defined else '' }}" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-700">Цена</label>
        <input name="price" type="number" min="0" value="{{ menu_item.price if menu_item is defined else '' }}" required class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-700">Порция</label>
        <input name="amount" value="{{ menu_item.amount if menu_item is defined else '' }}" placeholder="200 г, 1 шт" class="mt-1 w-full rounded-md border border-slate-300 px-3 py-2">
    </div>

    <div class="sm:col-span-2">
        <label class="inline-flex cursor-pointer items-center gap-3 rounded-md border border-slate-200 bg-slate-50 px-3 py-2">
            <input type="checkbox" name="is_available" class="peer sr-only" {% if menu_item is not defined or menu_item.is_available %}checked{% endif %}>
            <span class="relative h-6 w-11 rounded-full bg-slate-300 transition-colors after:absolute after:left-1 after:top-1 after:h-4 after:w-4 after:rounded-full after:bg-white after:transition-transform peer-checked:bg-emerald-500 peer-checked:after:translate-x-5"></span>
            <span class="text-sm font-medium text-slate-700">Доступно для заказа</span>
        </label>
    </div>

    <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700">Категория</label>
        <select name="category_id" required class="mt-1 w-full rounded-md border border-slate-300 bg-white px-3 py-2">
            <option value="">Выберите категорию</option>
            {% for category in categories %}
            <option value="{{ category.id }}" {% if menu_item is defined and category.id == menu_item.category_id %}selected{% endif %}>{{ category.name }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-700">Изображение</label>
        <label data-image-upload-dropzone class="mt-1 block cursor-pointer rounded-lg border-2 border-dashed border-slate-300 bg-slate-50 p-4 transition hover:border-blue-300 hover:bg-blue-50">
            <input name="image" type="file" accept="image/*" class="sr-only" data-image-upload-input>
            <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
                <div class="flex h-28 w-full items-center justify-center overflow-hidden rounded-md border border-slate-200 bg-white sm:w-32">
                    {% if menu_item is defined and menu_item.image %}
                    <img src="/static/resource/{{ menu_item.image }}" alt="{{ menu_item.name }}" class="h-full w-full object-cover" data-image-upload-preview>
                    {% else %}
                    <img src="" alt="" class="hidden h-full w-full object-cover" data-image-upload-preview>
                    <svg data-image-upload-placeholder class="h-9 w-9 text-slate-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true">
                        <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                        <circle cx="9" cy="9" r="2"></circle>
                        <path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"></path>
                    </svg>
                    {% endif %}
                </div>
                <div class="min-w-0 flex-1">
                    <div class="text-sm font-semibold text-slate-800">Перетащите изображение сюда</div>
                    <div class="mt-1 text-xs text-slate-500">или нажмите, чтобы выбрать файл PNG, JPG, WEBP</div>
                    <div data-image-upload-filename class="mt-2 truncate text-xs font-medium text-blue-600">
                        {% if menu_item is defined and menu_item.image %}Текущее изображение{% else %}Файл не выбран{% endif %}
                    </div>
                    <div class="mt-3 h-1.5 overflow-hidden rounded-full bg-slate-200">
                        <div data-image-upload-progress class="h-full w-0 rounded-full bg-blue-600 transition-all duration-500"></div>
                    </div>
                    <div data-image-upload-status class="mt-1 text-xs text-slate-500">Ожидает выбора файла</div>
                </div>
            </div>
        </label>
    </div>
</div>
